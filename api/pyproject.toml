[project]
name = "vrptw"
version = "0.1.0"
description = "Planificador VRPTW: métodos clásicos y LLM."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "numpy",
    "deap",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.scripts]
vrptw = "vrptw.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrptw"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
markers = [
    "legado: pruebas de regresión contra los resultados de 2024",
    "lento: pruebas de minutos; excluidas salvo que se pida otro -m (p. ej. -m legado)",
]
# un -m en la línea de comandos sustituye a este
addopts = "-m 'not lento'"

[[tool.mypy.overrides]]
module = ["deap", "deap.*"]
ignore_missing_imports = true
